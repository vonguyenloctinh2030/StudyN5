name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up Python for Japanese audio
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate and verify Japanese learning audio
        run: |
          python -m pip install --disable-pip-version-check edge-tts==7.2.7
          python scripts/generate_language_audio.py

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: n5-kana-co-ban-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
